<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add a Bookmark</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1 id="form-title">Add a Bookmark</h1>

    <form id="bookmark-form" class="bookmark-form" aria-labelledby="form-title">
      <div class="field">
        <label for="url">URL</label>
        <input
          id="url"
          name="url"
          type="url"
          placeholder="https://example.com"
          autocomplete="url"
          aria-describedby="url-hint"
          required
        >
        <p id="url-hint" class="hint">Include https:// at the start.</p>
      </div>

      <div class="field">
        <label for="title">Title</label>
        <input
          id="title"
          name="title"
          type="text"
          placeholder="My favorite site"
          maxlength="120"
          required
        >
      </div>

      <div class="field">
        <label for="category">Category</label>
        <div class="select-wrapper">
          <select id="category" name="category" required>
            <option value="" disabled selected>Choose a category</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
            <option value="news">News</option>
            <option value="entertainment">Entertainment</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-button">Add Bookmark</button>
      <p id="storage-warning" class="storage-warning" role="alert" hidden>
        Your browser is blocking storage, so bookmarks won't be kept after you refresh.
      </p>
    </form>

    <section class="saved" aria-labelledby="saved-title">
      <h2 id="saved-title">
        Saved Bookmarks <span id="bookmark-count" class="count">0</span>
      </h2>
      <div id="search-box" class="search-box" hidden>
        <label for="search" class="visually-hidden">Search bookmarks</label>
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="search" type="search" placeholder="Search by title, site, or category" autocomplete="off">
      </div>
      <div id="bookmark-groups" class="bookmark-groups"></div>
      <p id="empty-message" class="empty-message">No bookmarks yet. Add your first one above.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
