<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmarks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Bookmarks</h1>
      <p class="subtitle">Save links you want to come back to.</p>
    </header>

    <form id="bookmark-form" class="card form" novalidate>
      <div class="field">
        <label for="url">URL</label>
        <input id="url" name="url" type="text" inputmode="url" placeholder="example.com" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="title">Title <span class="optional">(optional)</span></label>
        <input id="title" name="title" type="text" placeholder="My favorite site" autocomplete="off" maxlength="120">
      </div>
      <button type="submit" class="btn-primary">Add bookmark</button>
      <p id="form-message" class="form-message" role="alert"></p>
    </form>

    <p id="storage-warning" class="storage-warning" hidden>
      Your browser is blocking storage, so bookmarks will disappear when you close this page.
    </p>

    <section aria-labelledby="list-heading">
      <div class="list-header">
        <h2 id="list-heading">Saved</h2>
        <span id="count" class="count">0</span>
      </div>
      <div id="search-box" class="search-box" hidden>
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="search" type="search" placeholder="Search by title" aria-label="Search bookmarks by title" autocomplete="off">
      </div>
      <ul id="bookmark-list" class="bookmark-list"></ul>
      <p id="empty-state" class="empty-state">No bookmarks yet. Add your first one above.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
